# BrickArt login theme. Extends Keycloak's default (v2) theme, so every page —
# login, register, reset password, OTP, errors — keeps working and is restyled
# by css/brickart.css rather than re-implemented.
parent=keycloak.v2

# css/styles.css resolves to the parent's file; ours load after it.
styles=css/styles.css css/fonts.css css/brickart.css

# Follow the visitor's light/dark preference (brickart.css styles both).
darkMode=true

